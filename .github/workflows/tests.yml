name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Check Python syntax
        run: python -m compileall -q custom_components tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  setup-tests:
    strategy:
      matrix:
        homeassistant: ["2026.10.4", "2026.11.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Install Home Assistant test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install target Home Assistant version
        run: python -m pip install homeassistant==${{ matrix.homeassistant }}
      - name: Test station discovery and setup flows
        run: python scripts/run_ha_tests.py
