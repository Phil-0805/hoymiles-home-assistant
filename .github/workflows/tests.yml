name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check Python syntax
        run: python -m compileall -q custom_components tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  setup-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Home Assistant test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Test station discovery and setup flows
        run: python -m pytest tests/ha -q
