name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check Python syntax
        run: python -m compileall -q custom_components tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
