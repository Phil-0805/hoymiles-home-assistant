name: Release

on:
  push:
    branches:
      - main
      - beta/station-selection
      - beta/inverter-model-discovery
      - beta/battery-settings-fallback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip install homeassistant==2026.11.0
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_ha_tests.py

  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta/station-selection' || github.ref == 'refs/heads/beta/inverter-model-discovery' || github.ref == 'refs/heads/beta/battery-settings-fallback'
    needs: [validate, test]
    concurrency:
      group: hoymiles-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_READINESS_JSON: ${{ secrets.RELEASE_READINESS_JSON }}
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('custom_components/hoymiles_home/manifest.json', 'utf8'));
            const version = manifest.version;
            const prerelease = /^\d+\.\d+\.\d+b\d+$/.test(version);
            const stable = /^\d+\.\d+\.\d+$/.test(version);
            if (!stable && !prerelease) {
              throw new Error('Version does not match the release channel');
            }
            if (context.ref !== 'refs/heads/main' && !prerelease) {
              core.notice('Stable version prepared on a beta branch; publish only after merge to main.');
              return;
            }
            const tag = `v${version}`;
            const repo = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({...repo, tag});
              core.notice(`${tag} already exists; leaving its release and tag unchanged. Bump the version for a new release.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (stable) {
              require('child_process').execFileSync(
                'python3', ['scripts/check_release_readiness.py', '--version', version, '--commit', context.sha],
                {stdio: 'inherit'}
              );
            }
            const body = fs.readFileSync(`docs/release-${version}.md`, 'utf8');
            const result = await github.rest.repos.createRelease({
              ...repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: prerelease ? `${tag} — beta` : `${tag}`,
              body,
              prerelease,
              make_latest: prerelease ? 'false' : 'true',
            });
            core.notice(`Published release: ${result.data.html_url}`);
